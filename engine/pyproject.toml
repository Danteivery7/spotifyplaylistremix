[project]
name = "playlist-remix-engine"
version = "0.2.0"
description = "Long-form intelligent playlist remix engine"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]>=0.35,<1",
  "librosa==1.0.0",
  "numpy>=2.0,<3",
  "soundfile>=0.13,<1",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1"
]

[project.optional-dependencies]
stems = ["audio-separator>=0.30"]
dev = ["pytest>=8.4,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
